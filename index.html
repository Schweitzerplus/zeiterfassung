<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lohnabrechnung – Schweitzer plus GmbH</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#F0F2F7;--surface:#fff;--surface-2:#F7F8FA;--border:#E2E6EF;
    --accent:#0F1525;--accent2:#3B6FFF;--accent-light:#EEF3FF;
    --success:#22C55E;--danger:#EF4444;--warning:#F59E0B;
    --text:#0F1525;--text-2:#4A5272;--text-3:#8B93B0;
    --radius:14px;--radius-sm:8px;
    --shadow-sm:0 1px 3px rgba(15,21,37,.07);--shadow:0 4px 16px rgba(15,21,37,.08);
  }
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:40px}
  header{background:var(--text);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100}
  .logo{display:flex;flex-direction:column;line-height:1.2}
  .logo span:first-child{color:#fff;font-size:15px;font-weight:800}
  .logo span:last-child{color:#3B6FFF;font-size:11px;font-weight:600}
  .header-right{display:flex;gap:8px;align-items:center}
  .btn-h{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.8);font-family:'Inter',sans-serif;font-size:12px;font-weight:600;padding:7px 14px;border-radius:8px;cursor:pointer;transition:all .15s}
  .btn-h:hover,.btn-h.active{background:#3B6FFF;border-color:#3B6FFF;color:#fff}
  main{max-width:1000px;margin:0 auto;padding:28px 20px 0}
  .card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);padding:24px;margin-bottom:20px;box-shadow:var(--shadow-sm)}
  .card-title{font-size:15px;font-weight:700;margin-bottom:18px;display:flex;align-items:center;gap:8px}
  .card-icon{width:28px;height:28px;border-radius:7px;background:var(--accent-light);color:var(--accent2);display:grid;place-items:center;font-size:14px}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:10px 20px;border-radius:10px;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .15s;white-space:nowrap}
  .btn-primary{background:#3B6FFF;color:#fff}
  .btn-primary:hover{background:#2554E8;transform:translateY(-1px)}
  .btn-sm{padding:7px 14px;font-size:13px}
  .btn-outline{background:transparent;color:#3B6FFF;border:1.5px solid #3B6FFF}
  .btn-outline:hover{background:var(--accent-light)}
  .btn-danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
  .btn-danger:hover{background:#FEF2F2}
  .btn-success{background:var(--success);color:#fff}
  .btn-excel{background:#217346;color:#fff}
  .btn-pdf{background:#C0392B;color:#fff}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:12px;font-weight:600;color:var(--text-2)}
  .field input,.field select{font-family:'Inter',sans-serif;font-size:14px;color:var(--text);background:var(--surface-2);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:9px 13px;outline:none;width:100%;transition:border-color .15s}
  .field input:focus,.field select:focus{border-color:#3B6FFF;background:#fff}
  .form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  .form-grid.g2{grid-template-columns:1fr 1fr}
  .form-grid.g4{grid-template-columns:1fr 1fr 1fr 1fr}

  /* EMPLOYEE TABLE */
  .emp-table{width:100%;border-collapse:collapse}
  .emp-table th{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.6px;padding:8px 12px;border-bottom:2px solid var(--border);text-align:left;white-space:nowrap}
  .emp-table td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
  .emp-table tr:last-child td{border-bottom:none}
  .emp-table tr:hover td{background:var(--surface-2)}
  .emp-table input,.emp-table select{font-family:'Inter',sans-serif;font-size:13px;border:1.5px solid var(--border);border-radius:6px;padding:5px 8px;background:var(--surface-2);outline:none;width:100%}
  .emp-table input:focus,.emp-table select:focus{border-color:#3B6FFF;background:#fff}

  /* LOHN CALC */
  .lohn-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
  .lohn-row:last-child{border-bottom:none}
  .lohn-label{font-size:13px;color:var(--text-2)}
  .lohn-value{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600}
  .lohn-value.pos{color:var(--text)}
  .lohn-value.neg{color:var(--danger)}
  .lohn-value.total{color:#3B6FFF;font-size:16px}
  .lohn-value.netto{color:var(--success);font-size:16px}
  .lohn-divider{height:1px;background:var(--border);margin:8px 0}
  .lohn-section-title{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.8px;padding:10px 0 4px}

  /* MONAT TABS */
  .month-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
  .month-tab{padding:7px 16px;border-radius:20px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:var(--surface-2);color:var(--text-2);transition:all .12s}
  .month-tab:hover{border-color:#3B6FFF;color:#3B6FFF}
  .month-tab.active{background:#3B6FFF;border-color:#3B6FFF;color:#fff}

  /* STATUS BADGE */
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
  .badge-ok{background:#DCFCE7;color:#16A34A}
  .badge-pending{background:#FEF9C3;color:#A16207}
  .badge-none{background:var(--surface-2);color:var(--text-3)}

  /* TOAST */
  .toast-container{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:8px;z-index:999}
  .toast{background:var(--text);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:0 12px 40px rgba(15,21,37,.12);display:flex;align-items:center;gap:10px;animation:slideIn .2s ease}
  .toast.success{border-left:3px solid var(--success)}
  .toast.error{border-left:3px solid var(--danger)}
  @keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}

  /* MODAL */
  .modal-overlay{position:fixed;inset:0;background:rgba(15,21,37,.5);z-index:200;display:none;place-items:center;backdrop-filter:blur(3px)}
  .modal-overlay.open{display:grid}
  .modal{background:var(--surface);border-radius:var(--radius);padding:28px;width:100%;max-width:600px;box-shadow:0 12px 40px rgba(15,21,37,.12);margin:20px;max-height:90vh;overflow-y:auto}
  .modal-title{font-size:17px;font-weight:700;margin-bottom:18px}

  @media(max-width:700px){
    .form-grid{grid-template-columns:1fr}
    .form-grid.g2,.form-grid.g4{grid-template-columns:1fr}
    main{padding:16px 12px 0}
  }
</style>
</head>
<body>
<header>
  <div class="logo">
    <span>Lohnabrechnung</span>
    <span>Schweitzer plus GmbH</span>
  </div>
  <div class="header-right">
    <button class="btn-h active" onclick="switchView('lohn')">💰 Lohnblätter</button>
    <button class="btn-h" onclick="switchView('mitarbeiter')">👥 Mitarbeitende</button>
  </div>
</header>

<main>
  <!-- LOHN VIEW -->
  <div id="viewLohn">
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px">
        <div class="card-title" style="margin:0"><div class="card-icon">💰</div>Lohnabrechnung</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">

            <option value="2026-07">Juli 2026</option>
            <option value="2026-06">Juni 2026</option>

      </div>

  </div>

  <!-- MITARBEITER VIEW -->
  <div id="viewMitarbeiter" style="display:none">
    <div class="card">
      <div class="card-title"><div class="card-icon">👥</div>Mitarbeitende & Lohndaten</div>
      <div style="overflow-x:auto">
        <table class="emp-table" id="empTable">
          <thead>
            <tr>
              <th>Name</th>
              <th>AHV-Nr.</th>

              <th>Kanton</th>

              <th>Spesen/Tag</th>

          </thead>
          <tbody id="empTableBody"></tbody>
        </table>
      </div>
      <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border)">
        <button class="btn btn-primary btn-sm" onclick="openAddEmp()">+ Mitarbeiter hinzufügen</button>
      </div>

  </div>
</main>

<!-- LOHNBLATT MODAL -->
<div class="modal-overlay" id="lohnModal">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <div class="modal-title" id="lohnModalTitle" style="margin:0">Lohnblatt</div>
      <button onclick="closeLohnModal()" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-3)">✕</button>
    </div>
    <div id="lohnModalContent"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)">
      <button class="btn btn-sm btn-outline" onclick="closeLohnModal()">Schliessen</button>
      <button class="btn btn-sm btn-pdf" onclick="generatePDF()">📄 PDF erstellen</button>
    </div>
  </div>
</div>

<!-- ADD EMPLOYEE MODAL -->

  <div class="modal">
    <div class="modal-title">Mitarbeiter hinzufügen</div>
    <div class="form-grid g2" style="gap:14px">

      <div class="field"><label>AHV-Nr.</label><input type="text" id="newAhv" placeholder="756.xxxx.xxxx.xx"></div>

          <option value="C0N">C0N (verheiratet)</option>

      <div class="field"><label>BVG CHF/Monat</label><input type="number" id="newBvg" step="0.1" placeholder="0" value="0"></div>
      <div class="field"><label>Spesen pro Tag CHF</label><input type="number" id="newSpesen" step="0.5" value="15" placeholder="15"></div>

        <select id="new13ml">
          <option value="1">Ja (inkl. im Stundenansatz)</option>

        </select>

      <button class="btn btn-sm btn-primary" onclick="saveNewEmp()">✓ Speichern</button>

  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
// ===== SUPABASE =====
const SUPABASE_URL = 'https://aephgpjgubmudgftnbnq.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFlcGhncGpndWJtdWRnZnRuYm5xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0OTEyNjcsImV4cCI6MjA5ODA2NzI2N30.Zdcx2UiSW8hECLOlD3yg3n9DZsLg7FR9-KDK1bvjc5E';

async function sbFetch(path, opts={}) {
  const res = await fetch(SUPABASE_URL+'/rest/v1/'+path, {
    headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':opts.prefer||'return=representation',...opts.headers},
    ...opts
  });
  if(!res.ok) throw new Error(await res.text());
  const text = await res.text();
  return text ? JSON.parse(text) : [];
}

// ===== CONSTANTS =====
const AHV_PCT = 5.30;
const ALV_PCT = 1.10;
const NBUV_PCT = 1.67;
const ZPK_CHF = 19.00;
const FERIEN_PCT = 9.70;

const monthNames = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

// ===== STATE =====
let mitarbeiter = [];
let zeiteintraege = [];
let currentLohnblatt = null;

// Employee data from XLS files
const lohnDaten = {
  'Arman Andrei':     {ahv:'756.6146.6944.33', ansatz:23.70, kanton:'LU', tarif:'C0N', bvg:137.40, spesen:15, ml13:false},
  'Arman Ion':        {ahv:'756.1613.3994.60', ansatz:23.70, kanton:'LU', tarif:'A0N', bvg:0,      spesen:15, ml13:false},
  'Axenti Alexandru': {ahv:'756.7965.4494.26', ansatz:24.61, kanton:'LU', tarif:'A0N', bvg:0,      spesen:15, ml13:false},
  'Bulmaga Petru':    {ahv:'756.2220.0952.64', ansatz:22.79, kanton:'TG', tarif:'C0N', bvg:0,      spesen:15, ml13:false},
  'Covali Sergiu':    {ahv:'756.3304.4626.51', ansatz:23.70, kanton:'LU', tarif:'C0N', bvg:0,      spesen:15, ml13:false},
  'Harlamov Ivan':    {ahv:'756.8045.2861.91', ansatz:22.79, kanton:'LU', tarif:'A0N', bvg:0,      spesen:15, ml13:true},
  'Mitu Andrei':      {ahv:'756.8976.3092.66', ansatz:24.61, kanton:'LU', tarif:'A0N', bvg:0,      spesen:15, ml13:false},
  'Popa Ion':         {ahv:'756.0397.7496.21', ansatz:24.61, kanton:'LU', tarif:'A0N', bvg:0,      spesen:15, ml13:true},
  'Puiu Tudor':       {ahv:'756.2634.5896.49', ansatz:22.79, kanton:'LU', tarif:'A0N', bvg:0,      spesen:15, ml13:true},
  'Rauta Radu':       {ahv:'756.6759.8769.43', ansatz:23.70, kanton:'LU', tarif:'A0N', bvg:0,      spesen:15, ml13:false},
};

// Quellensteuer lookup (brutto → rate%) - from actual payslips
// These are the actual rates used in the XLS files
function getQST(brutto, kanton, tarif) {
  // Simple lookup table based on actual payslips
  // In production this would use the official cantonal tables
  // LU A0N rates (from payslips)
  const luA0N = [
    [1400,0.95],[2000,3.5],[2500,4.5],[3000,5.5],[3500,6.0],
    [3800,6.5],[4000,6.85],[4200,7.12],[4400,7.2],[4600,7.61],
    [4800,7.8],[5000,8.18],[5200,8.48],[5400,8.74],[5600,9.0],
    [6000,9.5],[7000,10.0],[9999999,11.0]
  ];
  const luC0N = [
    [2000,2.0],[3000,4.0],[3400,5.04],[3800,5.5],[4200,6.5],
    [4500,6.93],[5000,7.5],[9999999,8.5]
  ];
  const tgC0N = [
    [2000,2.0],[3000,4.0],[3800,5.46],[4500,6.0],[9999999,7.0]
  ];
  const tgA0N = [
    [2000,1.5],[3000,4.0],[4000,6.0],[5000,7.5],[9999999,9.0]
  ];
  const nwA0N = [
    [2000,1.0],[3000,3.5],[4000,6.0],[5000,7.5],[9999999,9.0]
  ];

  let table = luA0N;
  if(kanton==='LU' && tarif==='A0N') table = luA0N;
  else if(kanton==='LU' && tarif==='C0N') table = luC0N;
  else if(kanton==='TG' && tarif==='C0N') table = tgC0N;
  else if(kanton==='TG' && tarif==='A0N') table = tgA0N;
  else if(kanton==='NW' && tarif==='A0N') table = nwA0N;

  for(const [limit, rate] of table) {
    if(brutto <= limit) return rate;
  }
  return table[table.length-1][1];
}

// ===== VIEWS =====
function switchView(v) {
  document.getElementById('viewLohn').style.display = v==='lohn'?'block':'none';
  document.getElementById('viewMitarbeiter').style.display = v==='mitarbeiter'?'block':'none';
  document.querySelectorAll('.btn-h').forEach((b,i)=>b.classList.toggle('active',(v==='lohn'&&i===0)||(v==='mitarbeiter'&&i===1)));
  if(v==='mitarbeiter') renderEmpTable();
  if(v==='lohn') renderLohnListe();
}

// ===== LOHN BERECHNUNG =====
function berechneLohn(empName, stunden, spesenTage) {
  const d = lohnDaten[empName] || getLohnDatenFromMitarbeiter(empName);
  if(!d) return null;

  const ansatz = d.ansatz;
  const ferienAnsatz = ansatz * (FERIEN_PCT/100);
  const bruttoStunden = stunden * ansatz;
  const ferienZuschlag = stunden * ferienAnsatz;
  const brutto = bruttoStunden + ferienZuschlag;

  const ahvAbzug = Math.round(brutto * AHV_PCT) / 100;
  const alvAbzug = Math.round(brutto * ALV_PCT) / 100;
  const nbuvAbzug = Math.round(brutto * NBUV_PCT) / 100;
  const zpk = ZPK_CHF;
  const bvg = d.bvg || 0;
  const qstPct = getQST(brutto, d.kanton, d.tarif);
  const qstAbzug = Math.round(brutto * qstPct) / 100;

  const totalAbzuege = ahvAbzug + alvAbzug + nbuvAbzug + zpk + bvg + qstAbzug;
  const netto = brutto - totalAbzuege;
  const spesen = spesenTage * (d.spesen || 15);
  const auszahlung = netto + spesen;

  return {
    stunden, ansatz, ferienAnsatz, bruttoStunden, ferienZuschlag, brutto,
    ahvAbzug, alvAbzug, nbuvAbzug, zpk, bvg, qstPct, qstAbzug,
    totalAbzuege, netto, spesen, spesenTage, auszahlung,
    kanton: d.kanton, tarif: d.tarif, ahv: d.ahv,
    ml13: d.ml13
  };
}

function getLohnDatenFromMitarbeiter(empName) {
  const m = mitarbeiter.find(m=>m.name===empName);
  if(!m) return null;
  return {
    ahv: m.ahv_nr||'',
    ansatz: parseFloat(m.stundenansatz||0),
    kanton: m.kanton||'LU',
    tarif: m.qst_tarif||'A0N',
    bvg: parseFloat(m.bvg||0),
    spesen: parseFloat(m.spesen_tag||15),
    ml13: m.ml13||false
  };
}

// ===== RENDER LOHN LISTE =====
async function renderLohnListe() {
  const monat = document.getElementById('selMonat').value;
  const [year, month] = monat.split('-').map(Number);
  const monthName = monthNames[month-1] + ' ' + year;

  // Load entries from Supabase for this month
  let entries = [];
  try {
    entries = await sbFetch(`zeiteintraege?datum=gte.${monat}-01&datum=lte.${monat}-31&select=*`);
  } catch(e) { showToast('Verbindungsfehler — zeige lokale Daten','⚠️','error'); }

  // Group by employee
  const empGroups = {};
  entries.forEach(e => {
    const name = e.mitarbeiter_name || 'Unbekannt';
    if(!empGroups[name]) empGroups[name] = {stunden:0, tage:new Set(), eintraege:[]};
    empGroups[name].stunden += e.netto_min/60;
    empGroups[name].tage.add(e.datum);
    empGroups[name].eintraege.push(e);
  });

  // Add employees from lohnDaten that might not have entries
  const allEmps = new Set([...Object.keys(lohnDaten), ...Object.keys(empGroups)]);

  const el = document.getElementById('lohnListe');

  if(!Object.keys(empGroups).length) {
    el.innerHTML = `<div style="text-align:center;padding:40px;color:var(--text-3)">
      <div style="font-size:36px;margin-bottom:12px">📭</div>
      <div style="font-weight:600">Keine Zeiteinträge für ${monthName}</div>
      <div style="font-size:13px;margin-top:4px">Mitarbeitende müssen zuerst Stunden erfassen</div>
    </div>`;
    return;
  }

  let totalAuszahlung = 0;
  let rows = '';

  // Sort by name
  const sortedEmps = Object.keys(empGroups).sort();

  sortedEmps.forEach(name => {
    const g = empGroups[name];
    const stunden = Math.round(g.stunden * 10) / 10;
    const spesenTage = g.tage.size;
    const lohn = berechneLohn(name, stunden, spesenTage);
    if(lohn) totalAuszahlung += lohn.auszahlung;

    const hasData = !!lohnDaten[name] || mitarbeiter.find(m=>m.name===name)?.stundenansatz;

    rows += `<tr onclick="openLohnblatt('${name}','${monat}')" style="cursor:pointer">
      <td style="font-weight:600">${name}</td>
      <td style="font-family:'JetBrains Mono',monospace;color:#3B6FFF;font-weight:700">${stunden.toFixed(1)} h</td>
      <td>${spesenTage} Tage</td>
      <td style="font-family:'JetBrains Mono',monospace;font-weight:700">${lohn ? 'CHF '+fmtChf(lohn.brutto) : '—'}</td>

      <td><span class="badge ${hasData?'badge-ok':'badge-pending'}">${hasData?'✓ Komplett':'⚠ Lohndaten fehlen'}</span></td>
      <td><button class="btn btn-sm btn-pdf" onclick="event.stopPropagation();openLohnblatt('${name}','${monat}')" style="padding:5px 10px;font-size:11px">📄 PDF</button></td>
    </tr>`;
  });

  el.innerHTML = `
    <table class="emp-table" style="margin-bottom:16px">
      <thead><tr>
        <th>Mitarbeiter</th><th>Stunden</th><th>Spesen-Tage</th>
        <th>Brutto</th><th>Abzüge</th><th>Auszahlung</th><th>Status</th><th></th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div style="display:flex;justify-content:flex-end;padding:12px 16px;background:var(--surface-2);border-radius:var(--radius-sm)">
      <div style="text-align:right">
        <div style="font-size:12px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:.6px">Total Auszahlung ${monthName}</div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:800;color:#3B6FFF">CHF ${fmtChf(totalAuszahlung)}</div>
      </div>
    </div>`;
}

    y+=2; addDiv();

    // Final box
    doc.setFillColor(238,243,255);
    doc.roundedRect(ml,y,pw-ml-mr,12,2,2,'F');
    doc.setTextColor(15,21,37); doc.setFontSize(12); doc.setFont('helvetica','bold');
    doc.text('AUSZAHLUNG',ml+4,y+8);
    doc.setTextColor(59,111,255); doc.setFontSize(14);
    doc.text(`CHF ${fmtChf(lohn.auszahlung)}`,pw-mr-4,y+8,{align:'right'});
    y+=18;

    // Signature line
    doc.setDrawColor(226,230,239);
    doc.line(ml,y,ml+70,y);
    doc.line(ml+90,y,ml+160,y);
    doc.setTextColor(139,147,176); doc.setFontSize(8); doc.setFont('helvetica','normal');

    doc.save(`Lohnblatt_${empName.replace(' ','_')}_${currentLohnblatt.monat}.pdf`);
    showToast('PDF erstellt!','📄','success');
  } catch(e) {
    showToast('PDF-Fehler: '+e.message,'⚠️','error');
  }
}

async function exportAllPDF() {
  showToast('Erstelle PDFs für alle Mitarbeitenden…','📄','success');
  // Get all employees with entries this month
  const monat = document.getElementById('selMonat').value;
  try {
    const entries = await sbFetch(`zeiteintraege?datum=gte.${monat}-01&datum=lte.${monat}-31&select=mitarbeiter_name`);
    const emps = [...new Set(entries.map(e=>e.mitarbeiter_name).filter(Boolean))];
    for(const emp of emps) {
      await openLohnblatt(emp, monat);
      await new Promise(r=>setTimeout(r,100));
      generatePDF();
      closeLohnModal();
      await new Promise(r=>setTimeout(r,200));
    }
    showToast(`${emps.length} PDFs erstellt!`,'✓','success');
  } catch(e) { showToast('Fehler: '+e.message,'⚠️','error'); }
}

// ===== EXCEL EXPORT =====
async function exportExcel() {
  const monat = document.getElementById('selMonat').value;
  const [year, month] = monat.split('-').map(Number);
  const monthName = monthNames[month-1] + ' ' + year;

  let entries = [];
  try { entries = await sbFetch(`zeiteintraege?datum=gte.${monat}-01&datum=lte.${monat}-31&select=*`); } catch(e) {}

  const empGroups = {};
  entries.forEach(e => {
    const name = e.mitarbeiter_name||'Unbekannt';
    if(!empGroups[name]) empGroups[name]={stunden:0,tage:new Set()};
    empGroups[name].stunden += e.netto_min/60;
    empGroups[name].tage.add(e.datum);
  });

  const bom='\uFEFF', sep=';';
  const rows=[bom+'Lohnabrechnung '+monthName];
  rows.push('');
  rows.push(['Mitarbeiter','Stunden','Spesen-Tage','Stundenansatz','Bruttolohn','AHV','ALV','NBUV','ZPK','BVG','Quellensteuer %','Quellensteuer','Total Abzüge','Nettolohn','Spesen','Auszahlung'].join(sep));

  let totalAus=0;
  Object.entries(empGroups).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([name,g])=>{
    const stunden=Math.round(g.stunden*10)/10;
    const l=berechneLohn(name,stunden,g.tage.size);
    if(!l) return;
    totalAus+=l.auszahlung;
    rows.push([name,stunden.toFixed(2),g.tage.size,fmtChf(l.ansatz),fmtChf(l.brutto),
      fmtChf(l.ahvAbzug),fmtChf(l.alvAbzug),fmtChf(l.nbuvAbzug),fmtChf(l.zpk),fmtChf(l.bvg),
      l.qstPct+'%',fmtChf(l.qstAbzug),fmtChf(l.totalAbzuege),fmtChf(l.netto),fmtChf(l.spesen),fmtChf(l.auszahlung)].join(sep));
  });
  rows.push('');
  rows.push(['TOTAL','','','','','','','','','','','','','','','CHF '+fmtChf(totalAus)].join(sep));

  const blob=new Blob([rows.join('\n')],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url; a.download=`Lohnabrechnung_${monat}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  showToast('Excel exportiert!','📥','success');
}

  tbody.innerHTML = allEmps.map(([name, d])=>`
    <tr>
      <td style="font-weight:600">${name}</td>
      <td style="font-size:11px;color:var(--text-3)">${d.ahv}</td>
      <td><input type="number" value="${d.ansatz}" step="0.01" onchange="updateLohnDaten('${name}','ansatz',this.value)" style="width:80px"></td>
      <td>
        <select onchange="updateLohnDaten('${name}','kanton',this.value)" style="width:60px">
          <option ${d.kanton==='LU'?'selected':''}>LU</option>
          <option ${d.kanton==='NW'?'selected':''}>NW</option>
          <option ${d.kanton==='TG'?'selected':''}>TG</option>
        </select>
      </td>
      <td>
        <select onchange="updateLohnDaten('${name}','tarif',this.value)" style="width:70px">
          <option ${d.tarif==='A0N'?'selected':''}>A0N</option>
          <option ${d.tarif==='C0N'?'selected':''}>C0N</option>
          <option ${d.tarif==='B0N'?'selected':''}>B0N</option>

      <td><input type="number" value="${d.spesen}" step="0.5" onchange="updateLohnDaten('${name}','spesen',this.value)" style="width:60px"></td>

function updateLohnDaten(name, field, val) {
  if(!lohnDaten[name]) return;
  if(field==='ansatz'||field==='bvg'||field==='spesen') lohnDaten[name][field]=parseFloat(val)||0;
  else if(field==='ml13') lohnDaten[name][field]=val;
  else lohnDaten[name][field]=val;
  showToast(`${name}: ${field} aktualisiert`,'✓','success');
}

function openAddEmp() { document.getElementById('addEmpModal').classList.add('open'); }
function closeAddEmp() { document.getElementById('addEmpModal').classList.remove('open'); }
function saveNewEmp() {
  const name = document.getElementById('newName').value.trim();
  if(!name) return showToast('Bitte Namen eingeben.','⚠️','error');
  const ansatz = parseFloat(document.getElementById('newAnsatz').value)||0;
  if(!ansatz) return showToast('Bitte Stundenansatz eingeben.','⚠️','error');
  lohnDaten[name] = {
    ahv: document.getElementById('newAhv').value.trim(),
    ansatz,
    kanton: document.getElementById('newKanton').value,
    tarif: document.getElementById('newTarif').value,
    bvg: parseFloat(document.getElementById('newBvg').value)||0,
    spesen: parseFloat(document.getElementById('newSpesen').value)||15,
    ml13: document.getElementById('new13ml').value==='1'
  };
  closeAddEmp();
  renderEmpTable();
  showToast(`${name} hinzugefügt!`,'✓','success');
}

// ===== HELPERS =====
function fmtChf(n) {
  return (Math.round((n||0)*20)/20).toFixed(2).replace('.','.').replace(/\B(?=(\d{3})+(?!\d))/g,"'");
}

function showToast(msg,icon,type){
  const c=document.getElementById('toastContainer'),t=document.createElement('div');
  t.className=`toast ${type}`; t.innerHTML=`<span>${icon}</span><span>${msg}</span>`;
  c.appendChild(t); setTimeout(()=>t.remove(),3200);
}

document.getElementById('lohnModal').addEventListener('click',e=>{if(e.target===document.getElementById('lohnModal'))closeLohnModal();});
document.getElementById('addEmpModal').addEventListener('click',e=>{if(e.target===document.getElementById('addEmpModal'))closeAddEmp();});

// Init
renderLohnListe();
